version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    environment:
      - POSTGRES_USER=pulsetrade
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=marketdata
    ports:
      - "5432:5432"